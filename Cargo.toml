[package]
name = "ircbot"
version = "2.4.5"
edition = "2024"
rust-version = "1.89"
description = "IRC bot with an encrypted hub mesh (safe-Rust port of ircbot.c)"
license = "MIT"
publish = false

[[bin]]
name = "ircbot"
path = "src/main.rs"

# The client tools in utils/ (utils/README.txt): self-contained, each the
# Rust port of the C tool of the same name in ircbot/utils.
[[bin]]
name = "keygen"
path = "utils/keygen.rs"

[[bin]]
name = "bot-auth"
path = "utils/bot_auth.rs"

[dependencies]
# Cryptography (RustCrypto + dalek): AES-256-GCM, HKDF/PBKDF2-SHA256,
# Ed25519 signatures and X25519 key agreement.
aes-gcm = "0.11"
ed25519-dalek = "3.0"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
hkdf = "0.13"
pbkdf2 = "0.13"
sha2 = "0.11"
getrandom = "0.4"
zeroize = "1.9"
base64 = "0.23"
# keygen only: passphrase-protected keys (irchub/docs/console.md §9) --
# scrypt for the irckey-v2 IRC key, bcrypt_pbkdf + AES-256-CTR for the
# OpenSSH key.  All pure Rust.
scrypt = { version = "0.12", default-features = false }
bcrypt-pbkdf = "0.11"
aes = "0.9"
ctr = "0.10"

# Networking: poll loop, sockets (VHOST bind), TLS, HTTPS for the updater.
# rustls runs on the graviola provider: pure Rust with Rust-level asm, no C
# and no cc(1) at build time, so the self-updater's rebuild needs only rustc.
# graviola is x86_64/aarch64 only and asserts on its required CPU features.
mio = { version = "1", features = ["os-poll", "net"] }
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }

# OS integration through safe wrappers.
nix = { version = "0.31", features = ["user", "fs", "process", "term", "resource", "feature", "socket"] }
region = "4"
signal-hook = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
# Forgetting a Zeroizing/Locked value skips its wipe.
mem_forget = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Keep unwinding: secret wiping is Drop-based (Zeroizing, Locked's mlock
# guard) and panic = "abort" runs no destructors.  Core dumps are already
# off via RLIMIT_CORE 0 + set_dumpable(false) in harden_process().
panic = "unwind"
# Drops DWARF but keeps the symbol table, so a field backtrace stays readable.
strip = "debuginfo"
# A wraparound on hostile input becomes a controlled [FATAL], not a bad index.
overflow-checks = true

# bot-auth.exe's key holder on Windows (utils/bot_auth.rs): named pipes with
# a user-only DACL, and the passphrase prompt with echo off.
[target.'cfg(windows)'.dependencies]
interprocess = "2.4"
rpassword = "7"
widestring = "1"
