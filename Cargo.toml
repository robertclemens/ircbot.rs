[package]
name = "ircbot"
version = "2.5.4"
edition = "2024"
rust-version = "1.89"
description = "IRC bot with an encrypted hub mesh (safe-Rust port of ircbot.c)"
license = "MIT"
publish = false

[[bin]]
name = "ircbot"
path = "src/main.rs"

# The client tools in utils/ (utils/README.txt): self-contained, each the
# Rust port of the C tool of the same name in ircbot/utils.
[[bin]]
name = "keygen"
path = "utils/keygen.rs"

[[bin]]
name = "bot-auth"
path = "utils/bot_auth.rs"

[features]
# Testnet only, never a release: compiles in the env overrides that point the
# updater at a sandbox release tree and its throwaway signing key.  Without it
# the binary has no code that reads them (see updater.rs env_root).
test-hooks = []

[dependencies]
# Cryptography (RustCrypto + dalek): AES-256-GCM, HKDF/PBKDF2-SHA256,
# Ed25519 signatures and X25519 key agreement.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
ed25519-dalek = { version = "3.0", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "3.0", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha2 = { version = "0.11", default-features = false }
getrandom = "0.4"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
# keygen only: passphrase-protected keys (irchub/docs/console.md §9) --
# scrypt for the irckey-v2 IRC key, bcrypt_pbkdf + AES-256-CTR for the
# OpenSSH key.  All pure Rust.
scrypt = { version = "0.12", default-features = false }
bcrypt-pbkdf = { version = "0.11", default-features = false, features = ["alloc"] }
aes = "0.9"
ctr = "0.10"

# Networking: poll loop, sockets (VHOST bind), TLS, HTTPS for the updater.
# rustls runs on the graviola provider: pure Rust with Rust-level asm, no C
# and no cc(1) at build time, so the self-updater's rebuild needs only rustc.
# graviola is x86_64/aarch64 only and asserts on its required CPU features.
mio = { version = "1", features = ["os-poll", "net"] }
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"
# The IRC server certificate check (review 9): Mozilla's roots, bundled, as
# the updater's HTTPS already uses through ureq -- the same on every host and
# in the static build.
webpki-roots = "1"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

# OS integration through safe wrappers.
nix = { version = "0.32", features = ["user", "fs", "signal", "term", "resource", "socket"] }
region = { version = "4", default-features = false }
signal-hook = { version = "0.4", default-features = false }
jiff = { version = "1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
# Forgetting a Zeroizing/Locked value skips its wipe.
mem_forget = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Keep unwinding: secret wiping is Drop-based (Zeroizing, Locked's mlock
# guard) and panic = "abort" runs no destructors.  Core dumps are already
# off via RLIMIT_CORE 0 + set_dumpable(false) in harden_process().
panic = "unwind"
# Drops DWARF but keeps the symbol table, so a field backtrace stays readable.
strip = "debuginfo"
# A wraparound on hostile input becomes a controlled [FATAL], not a bad index.
overflow-checks = true

# bot-auth.exe's key holder on Windows (utils/bot_auth.rs): named pipes with
# a user-only DACL, and the passphrase prompt with echo off.
[target.'cfg(windows)'.dependencies]
interprocess = "2.4"
rpassword = "7"
widestring = "1"
