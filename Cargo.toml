[package]
name = "ircbot"
version = "2.3.0"
edition = "2021"
rust-version = "1.89"
description = "IRC bot with an encrypted hub mesh (safe-Rust port of ircbot.c)"
license = "MIT"

[dependencies]
# Cryptography (RustCrypto + dalek): AES-256-GCM, HKDF/PBKDF2-SHA256,
# Ed25519 signatures and X25519 key agreement.
aes-gcm = "0.10"
ed25519-dalek = "2.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hkdf = "0.12"
pbkdf2 = "0.12"
sha2 = "0.10"
getrandom = "0.3"
zeroize = "1.8"
base64 = "0.22"

# Networking: poll loop, sockets (VHOST bind), TLS, HTTPS for the updater.
mio = { version = "1", features = ["os-poll", "net"] }
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq = "3"

# OS integration through safe wrappers.
nix = { version = "0.30", features = ["user", "fs", "process", "term", "resource", "feature"] }
region = "3"
signal-hook = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 2
